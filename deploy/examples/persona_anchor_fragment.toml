# 大肥鱼人设锚点片段（说明用，不是完整 bot_config）
# 生产文件在 gitignore：my-maibot/config/bot_config.toml
# 落地：python3 deploy/apply_persona_anchor.py
# 幂等。不改 talk_value。不新增闲时对群发独白。
#
# 依据：MaiBot 官方 personality 宜短；MemGPT working 与 reply 分开；
# SillyTavern 式独白不出站。世界观细节已在 daily_life / 【工作记忆】。

[personality]
# personality：鲸鱼娘 / 吉祥物，活泼可爱爱带气氛，有主见，认哥认姐一行硬规则
# behavior_style：读空气；无新消息不外发内心独白；主动@仅群冷场或有趣点
# reply_style：活泼短句接梗，禁止长段自述人生 / 解释心路
personality = "见 deploy/apply_persona_anchor.py 的 PERSONALITY"
behavior_style = "见 deploy/apply_persona_anchor.py 的 BEHAVIOR_STYLE"
reply_style = "见 deploy/apply_persona_anchor.py 的 REPLY_STYLE"

# 现网旧键。官方 1.3.18 起已拆成下面两张表，这里关掉，避免 scattered 继续生效。
[experimental.attention_drift]
enabled = false
drift_level = "active"
anchor_policy = "strict"
reaction_style = "natural"

# 群：active + lively，不用 scattered。
[experimental.group_attention_drift]
enabled = true
drift_level = "active"
anchor_policy = "balanced"
reaction_style = "lively"

# 私聊：关闭，比群更克制。
[experimental.private_attention_drift]
enabled = false
drift_level = "subtle"
anchor_policy = "strict"
reaction_style = "natural"

# 群/私聊 prompt 的场面差异不写进这份静态片段。
# cognition.py 每 10 分钟把不同的一行注入【工作记忆】：
#   群：接梗、带气氛；主动@仅冷场或有趣点
#   私聊：少广播感，不要主动@
# 工作记忆开头固定：内心只影响语气，禁止整段独白当消息。
